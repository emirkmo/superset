name: Publish local Superset 6.1.1 image

on:
  push:
    branches:
      - build-6.1.1-image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out local 6.1.1 tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: 6.1.1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish lean Python 3.12 image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: lean
          push: true
          platforms: linux/amd64
          build-args: |
            PY_VER=3.12.14-slim-bookworm
          tags: |
            ghcr.io/emirkmo/superset:6.1.1
            ghcr.io/emirkmo/superset:6.1.1-db6b16701a
